# Default `docker compose up` starts local dependency services.
# Use `docker compose --profile proxy up -d` to add the local Nginx proxy.
# For test DB/search: `docker compose --profile test up` (or `COMPOSE_PROFILES=test`).
services:
  nginx:
    profiles:
      - proxy
    image: nginx:1.27.5-alpine
    hostname: nginx
    restart: on-failure
    ports:
      - "4080:80"
    volumes:
      - ./config/nginx/dev.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:18
    hostname: postgres
    restart: on-failure
    ports:
      - "10001:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vmemo_dev

  typesense:
    image: typesense/typesense:30.1
    hostname: typesense
    restart: on-failure
    ports:
      - "10002:8108"
    volumes:
      - ts-data:/data
    command: "--data-dir /data --api-key=xyz --enable-cors"

  typelens:
    image: ghcr.io/copperline-ai/typelens:1.19.7
    ports:
      - "10003:3000"
    environment:
      TYPESENSE_SERVER_NAME: local
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
    depends_on:
      - typesense

  postgres-test:
    profiles:
      - test
    image: postgres:18
    hostname: postgres-test
    restart: on-failure
    ports:
      - "20001:5432"
    volumes:
      - pg-test-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vmemo_test

  typesense-test:
    profiles:
      - test
    image: typesense/typesense:30.1
    hostname: typesense-test
    restart: on-failure
    ports:
      - "20002:8108"
    volumes:
      - ts-test-data:/data
    command: "--data-dir /data --api-key=xyz --enable-cors"

volumes:
  pg-data:
  pg-test-data:
  ts-data:
  ts-test-data:
