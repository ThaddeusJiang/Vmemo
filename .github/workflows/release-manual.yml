# Manually create and publish a GitHub pre-release from the selected branch and tag.
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example: 2026.6.12 or 2026.6.12-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-manual-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ inputs.tag }})
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: prepare
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! [[ "$INPUT_TAG" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*(-(fix|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Invalid release tag: $INPUT_TAG"
            exit 1
          fi

          echo "version=${INPUT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub CLI
        run: gh --version

      - name: Create or update published GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$INPUT_TAG" >/dev/null 2>&1; then
            gh release edit "$INPUT_TAG" \
              --title "Vmemo $INPUT_TAG" \
              --prerelease \
              --draft=false \
              --latest=false
          else
            gh release create "$INPUT_TAG" \
              --target "$RELEASE_BRANCH" \
              --title "Vmemo $INPUT_TAG" \
              --generate-notes \
              --prerelease
          fi

  docker:
    name: docker (${{ needs.release.outputs.version }})
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      is_prerelease: true
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
