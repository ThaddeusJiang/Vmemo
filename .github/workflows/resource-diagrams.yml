name: Resource diagrams

# Regenerates Ash resource diagram markdown files (mix ash.generate_resource_diagrams)
# and commits them under lib/vmemo/.

on:
  push:
    branches: [main]
    paths:
      - "lib/vmemo/**"
      - ".github/workflows/resource-diagrams.yml"
  workflow_dispatch:

concurrency:
  group: resource-diagrams-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ash-resource-diagrams:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vmemo_test
      TEST_TYPESENSE_URL: http://localhost:8108
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764 # v1.23.0
        id: beam
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Generate Ash resource diagrams (Markdown)
        run: mix ash.generate_resource_diagrams --format md

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore(resource): refresh Ash resource diagrams [skip ci]"
          file_pattern: "lib/vmemo/*-mermaid-class-diagram.md"
